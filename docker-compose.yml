services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: product-api

    ports:
      - "8081:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProductApiDb;User Id=sa;Password=ProductApi@12345;TrustServerCertificate=True;MultipleActiveResultSets=true"

      Jwt__Key: "ProductApiAssessment-SuperSecretKey-2026-ChangeThisInProduction-123456789"
      Jwt__Issuer: "ProductApi"
      Jwt__Audience: "ProductApiClient"
      Jwt__AccessTokenExpirationMinutes: "30"
      Jwt__RefreshTokenExpirationDays: "7"

    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: product-api-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ProductApi@12345"

    ports:
      - "1433:1433"

    volumes:
      - product-api-sql-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ProductApi@12345' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  product-api-sql-data: